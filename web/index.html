<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure Heat Care – Stock Management System">

  <!-- Always white/light status bar — no dark flash on any device -->
  <meta name="theme-color" content="#ffffff">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Secure Heat Care">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Secure Heat Care</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #ffffff;                          /* white always */
      font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
    }

    /* ── Brand tokens (always light / white) ──────────────────── */
    :root {
      --brand-orange: #F47B20;
      --brand-purple: #2B1888;
      --tagline-clr:  #AAAAAA;
      --ring-dash:    rgba(244, 123, 32, 0.28);
      --glow-clr:     rgba(244, 123, 32, 0.07);
    }

    /* ── Splash overlay ───────────────────────────────────────── */
    #shc-splash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }
    #shc-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ── Dot grid — top-left ──────────────────────────────────── */
    .dot-grid {
      position: absolute;
      top: 24px; left: 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      animation: fadeIn 0.6s ease 0.1s both;
    }
    .dot-grid span {
      display: block;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--brand-orange);
    }
    .dot-grid span:nth-child(1)  { opacity:.75; }
    .dot-grid span:nth-child(2)  { opacity:.62; }
    .dot-grid span:nth-child(3)  { opacity:.50; }
    .dot-grid span:nth-child(4)  { opacity:.36; }
    .dot-grid span:nth-child(5)  { opacity:.24; }
    .dot-grid span:nth-child(6)  { opacity:.60; }
    .dot-grid span:nth-child(7)  { opacity:.48; }
    .dot-grid span:nth-child(8)  { opacity:.38; }
    .dot-grid span:nth-child(9)  { opacity:.28; }
    .dot-grid span:nth-child(10) { opacity:.18; }
    .dot-grid span:nth-child(11) { opacity:.48; }
    .dot-grid span:nth-child(12) { opacity:.36; }
    .dot-grid span:nth-child(13) { opacity:.26; }
    .dot-grid span:nth-child(14) { opacity:.18; }
    .dot-grid span:nth-child(15) { opacity:.10; }
    .dot-grid span:nth-child(n+16) { opacity:.08; }

    /* ── Dot grid — bottom-right (subtle mirror) ──────────────── */
    .dot-grid-br {
      position: absolute;
      bottom: 120px; right: 24px;
      opacity: 0.40;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      animation: fadeIn 0.7s ease 0.2s both;
    }
    .dot-grid-br span {
      display: block;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--brand-orange);
      opacity: 0.35;
    }

    /* ── Orbital ring wrapper ─────────────────────────────────── */
    .orbit-wrap {
      position: relative;
      width: 320px; height: 320px;
      margin-bottom: 24px;
      animation: scaleIn 0.75s cubic-bezier(.22,1,.36,1) 0.10s both;
      flex-shrink: 0;
    }

    /* SVG dashed ring (rotates via animateTransform) */
    .orbit-svg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
    }

    /* Pulsing glow behind logo */
    .orbit-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 220px; height: 110px;
      border-radius: 60px;
      background: radial-gradient(ellipse, rgba(244,123,32,0.10) 0%, transparent 70%);
      animation: glowPulse 2.4s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.8; }
      50%       { transform: translate(-50%, -50%) scale(1.08); opacity: 1;   }
    }

    /* Full Secure Heat Care logo (landscape) in the center */
    .orbit-logo-full {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 210px;
      height: auto;
      object-fit: contain;
      animation: logoFade 0.6s ease 0.35s both;
    }
    /* CSS fallback shown via JS if logo.png fails */
    .logo-fallback {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: logoFade 0.6s ease 0.35s both;
    }
    .fb-flame {
      width: 52px; height: 52px;
      border-radius: 50% 50% 42% 42% / 58% 58% 38% 38%;
      background: linear-gradient(160deg, #F47B20 0%, #FF9A5C 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 22px rgba(244,123,32,0.30);
    }
    .fb-inner { width: 24px; height: 24px; border-radius: inherit; background: #2B1888; }
    .fb-text { font-size: 13px; font-weight: 800; color: var(--brand-purple); letter-spacing: 2px; }

    /* ── Feature icon bubbles ────────────────────────────────────
       Each icon is absolutely positioned at its orbit point.
       Staggered pop-in: scale 0.2→1 with elastic overshoot.
    ─────────────────────────────────────────────────────────────*/
    .orbit-icon {
      position: absolute;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid var(--brand-orange);
      display: flex; align-items: center; justify-content: center;
      /* Same soft orange halo the Flutter bubbles carry. */
      box-shadow: 0 0 10px 1px rgba(244,123,32,0.15);
      color: var(--brand-orange);
      /* Center each icon on its anchor point */
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      animation: iconPop 0.55s cubic-bezier(.22,1,.36,1) forwards;
    }
    .orbit-icon svg { width: 18px; height: 18px; display: block; }
    @keyframes iconPop {
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    /*
      Five icons at equal 72° steps around the whole ring, starting at the
      top — a point-up pentagon, matching the Flutter SplashView exactly so
      web and mobile read the same. Orbit radius = 128, center = 160.
        i=0  -90°  (top)          x=160,   y=32
        i=1  -18°  (upper-right)  x=281.7, y=120.4
        i=2   54°  (lower-right)  x=235.3, y=263.6
        i=3  126°  (lower-left)   x=84.7,  y=263.6
        i=4  198°  (upper-left)   x=38.3,  y=120.4
    */
    .icon-p0 { top: 32px;    left: 160px;   animation-delay: 0.50s; }
    .icon-p1 { top: 120.4px; left: 281.7px; animation-delay: 0.58s; }
    .icon-p2 { top: 263.6px; left: 235.3px; animation-delay: 0.66s; }
    .icon-p3 { top: 263.6px; left: 84.7px;  animation-delay: 0.74s; }
    .icon-p4 { top: 120.4px; left: 38.3px;  animation-delay: 0.82s; }

    /* ── Tagline ──────────────────────────────────────────────── */
    .splash-tagline {
      text-align: center;
      font-size: 13.5px;              /* matches the Flutter tagline */
      color: var(--tagline-clr);
      line-height: 1.75;
      letter-spacing: 0.3px;
      animation: fadeUp 0.5s ease 0.30s both;
    }
    .tagline-line {
      width: 42px; height: 3px;
      background: var(--brand-orange);
      border-radius: 99px;
      margin: 0 auto 14px;
    }

    /* ── City skyline SVG (bottom) ────────────────────────────── */
    .city-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100px;
      pointer-events: none;
    }
    .city-wrap svg { width: 100%; height: 100%; }

    /* ── Spinner + label ──────────────────────────────────────── */
    .loader-row {
      position: absolute;
      bottom: 108px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeUp 0.5s ease 0.55s both;
    }
    .loader-spinner {
      width: 18px; height: 18px;
      border: 1.8px solid rgba(244,123,32,0.20);
      border-top-color: var(--brand-orange);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loader-text { font-size: 13px; color: var(--tagline-clr); }

    /* ── Three bouncing dots at bottom-center ──────────────────────
       Mirrors AppLoadingIndicator (lib/app/shared/widgets): three 11px
       dots, light→deep orange, each hopping 10px on a 900 ms cycle and
       lagging the one before it by 0.16 of that cycle.
    ───────────────────────────────────────────────────────────────*/
    .bottom-dots {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      height: 26px;
      animation: fadeIn 0.5s ease 0.55s both;
    }
    .bottom-dots span {
      display: block;
      width: 11px; height: 11px;
      margin: 0 4px;
      border-radius: 50%;
      animation: dotHop 0.9s ease-in-out infinite;
    }
    /* Negative delays so the wave is already in phase on the first frame. */
    .bottom-dots span:nth-child(1) { background:#FFCC99; animation-delay:-0.900s; }
    .bottom-dots span:nth-child(2) { background:#F47B20; animation-delay:-0.756s; }
    .bottom-dots span:nth-child(3) { background:#E5650A; animation-delay:-0.612s; }
    @keyframes dotHop {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes logoFade{ from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.72); }
      to   { opacity: 1; transform: scale(1);    }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ── Splash Screen ──────────────────────────────────────────────────── -->
  <div id="shc-splash">

    <!-- Dot grids -->
    <div class="dot-grid" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="dot-grid-br" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Orbital ring area -->
    <div class="orbit-wrap" aria-hidden="true">

      <!-- Dashed SVG ring with rotation animation -->
      <svg class="orbit-svg" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
        <g>
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 160 160"
            to="360 160 160"
            dur="14s"
            repeatCount="indefinite"
          />
          <circle cx="160" cy="160" r="128"
            fill="none"
            stroke="rgba(244,123,32,0.28)"
            stroke-width="1.5"
            stroke-dasharray="6 4"
            stroke-linecap="round"
          />
          <!-- Anchor dots at the five evenly-spaced icon positions -->
          <circle cx="160"   cy="32"    r="3.5" fill="rgba(244,123,32,0.40)"/>
          <circle cx="281.7" cy="120.4" r="3.5" fill="rgba(244,123,32,0.40)"/>
          <circle cx="235.3" cy="263.6" r="3.5" fill="rgba(244,123,32,0.40)"/>
          <circle cx="84.7"  cy="263.6" r="3.5" fill="rgba(244,123,32,0.40)"/>
          <circle cx="38.3"  cy="120.4" r="3.5" fill="rgba(244,123,32,0.40)"/>
        </g>
      </svg>

      <!-- Glow behind logo -->
      <div class="orbit-glow"></div>

      <!-- Full Secure Heat Care logo -->
      <img
        class="orbit-logo-full"
        src="assets/assets/logo.png"
        alt="Secure Heat Care"
        onerror="
          this.style.display='none';
          document.getElementById('logo-fb').style.display='flex';
        "
      >
      <!-- CSS fallback if logo.png not cached yet -->
      <div id="logo-fb" class="logo-fallback">
        <div class="fb-flame"><div class="fb-inner"></div></div>
        <div class="fb-text">SECURE HEAT CARE</div>
      </div>

      <!-- Feature icon bubbles — same icon at the same point as the Flutter
           SplashView: inventory, cart, reports, security, clients. Drawn as
           inline SVG rather than emoji so they render in the brand orange
           and identically on every OS, matching the Material outline icons
           the Flutter splash uses. -->
      <div class="orbit-icon icon-p0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="4" rx="1"/>
          <path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/>
          <path d="M10 12h4"/>
        </svg>
      </div>
      <div class="orbit-icon icon-p1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="20" r="1.4"/>
          <circle cx="18" cy="20" r="1.4"/>
          <path d="M2.5 3.5h2.6l2.5 11.6a1.5 1.5 0 0 0 1.5 1.2h8.2a1.5 1.5 0 0 0 1.5-1.2L21 7.5H6"/>
        </svg>
      </div>
      <div class="orbit-icon icon-p2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M7 17.5v-4.5"/><path d="M12 17.5v-11"/><path d="M17 17.5v-7.5"/>
        </svg>
      </div>
      <div class="orbit-icon icon-p3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.2l7 3v5.4c0 4.3-3 8-7 9.2-4-1.2-7-4.9-7-9.2V6.2l7-3z"/>
        </svg>
      </div>
      <div class="orbit-icon icon-p4">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8.5" r="3"/>
          <path d="M3.5 19c0-2.9 2.5-4.6 5.5-4.6s5.5 1.7 5.5 4.6"/>
          <path d="M16.2 6.3a3 3 0 0 1 0 5.5"/>
          <path d="M17.6 14.7c1.9.6 3.4 1.9 3.4 4.3"/>
        </svg>
      </div>
    </div><!-- /orbit-wrap -->

    <!-- Tagline (logo already shows brand name) -->
    <div class="splash-tagline">
      <div class="tagline-line"></div>
      Smart Solutions for Inventory,<br>
      Sales, Purchase &amp; Reports
    </div>


    <!-- City skyline (inline SVG — zero extra network request) -->
    <div class="city-wrap" aria-hidden="true">
      <svg viewBox="0 0 400 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="rgba(238,236,255,0.70)" d="
          M0,100 L0,42 L16,42 L16,55 L28,55 L28,30 L40,30 L40,46 L52,46
          L52,22 L64,22 L64,14 L72,14 L72,32 L88,32 L88,50 L112,50
          L112,62 L160,62 L160,70
          L240,70 L240,62 L288,62
          L288,50 L312,50 L312,32 L328,32 L328,14 L336,14 L336,22
          L348,22 L348,46 L360,46 L360,30 L372,30 L372,55 L384,55
          L384,42 L400,42 L400,100 Z
        "/>
      </svg>
    </div>

    <!-- Three bouncing dots at bottom-center (same as AppLoadingIndicator) -->
    <div class="bottom-dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

  </div><!-- /shc-splash -->

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // ── Ensure white background before Flutter mounts ─────────────────────
    document.body.style.background = '#ffffff';

    // ── Minimum splash display ────────────────────────────────────────────
    // This HTML splash only has to cover the engine boot: Flutter's own
    // SplashView renders the identical ring animation and runs for 2.5 s
    // after first frame, so hiding this one early reads as one continuous
    // screen (the same hand-off the native splash makes on mobile).
    var _splashStart = Date.now();
    var _MIN_MS      = 1200;        // minimum display time in milliseconds

    function _hideSplash() {
      var splash = document.getElementById('shc-splash');
      if (!splash) return;
      splash.classList.add('hidden');
      // Remove from DOM after transition completes (650 ms safety net)
      setTimeout(function () {
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      }, 700);
    }

    window.addEventListener('flutter-first-frame', function () {
      var elapsed   = Date.now() - _splashStart;
      var remaining = Math.max(0, _MIN_MS - elapsed);
      // If Flutter loaded before 2 s, wait for the remainder; else hide now
      setTimeout(_hideSplash, remaining);
    });
  </script>

</body>
</html>
